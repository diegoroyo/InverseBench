data:
  _target_: training.dataset.SIENFWv2
  root_convergence: /home/droyo/code-darkmatter/v0-datasets/sienfwv2-8k-fov[100]-res[512]-convergence.npy
  root_photometry: /home/droyo/code-darkmatter/v0-datasets/sienfwv2-8k-fov[100]-res[512]-photo[V].npy
  resolution: 512
  # root: /home/droyo/code-darkmatter/v0-datasets/nfw-5000-seed420.npy

model:
  _target_: models.precond.VPPrecond
  model_type: SongUNet
  img_resolution: 512
  img_channels: 2
  label_dim: 0
  model_channels: 128
  channel_mult: [1, 1, 2, 2, 4, 4]
  attn_resolutions: [16]
  num_blocks: 1
  dropout: 0.0

loss:
  _target_: training.loss.VPLoss

train:
  lr: 0.0001
  batch_size: 2
  num_steps: 100_000
  warmup_steps: 500
  ema_decay: 0.9999
  grad_clip: 0.0
  ema_halflife_nimg: 209600
  ema_rampup_ratio: 0.05
  tf32: True
  resume: None
  num_workers: 4

log:
  exp_dir: 'exps/pretrain'
  exp_name: gravlensing-sienfwv2-pretrain
  wandb: False
  project: 'gravlensing-sienfwv2-prior'
  group: 'training'
  log_every: 50
  save_every: 5000
