name: DAPSLL
method:
  _target_: algo.daps_ll.DAPSLL
  ll_num_steps: 1001
  ll_learning_rate: 0.0012621
  ll_tv_regularization_weight: 0.010216
  annealing_scheduler_config:
    num_steps: 200
    sigma_max: 100
    sigma_min: 0.1
