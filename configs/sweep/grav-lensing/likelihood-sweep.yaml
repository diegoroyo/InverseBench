program: main.py
project: GL
name: grav-lensing-full
method: bayes
metric:
  goal: maximize
  name: psnr

parameters:
  algorithm.method.learning_rate:
    distribution: log_uniform_values
    max: 0.1    
    min: 0.001

  algorithm.method.tv_regularization_weight:
    distribution: log_uniform_values
    max: 1.0   
    min: 0.0001

  problem.model.loss_factor_weak:
    distribution: log_uniform_values
    max: 1.0   
    min: 0.0001

  problem.model.loss_factor_strong:
    distribution: log_uniform_values
    max: 1.0   
    min: 0.001

# remember to change the problem file, don't use the test samples
command:
  - python
  - ${program}
  - problem=grav-lensing-weak+strong+photo-darkclusters-conditioning-snap67
  - algorithm=likelihood
  - pretrain=grav-lensing-darkclusters-conditioning-fov225
  - wandb=True
  - ${args_no_hyphens}